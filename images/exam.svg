<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="examBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c38"/>
      <stop offset="100%" stop-color="#080b18"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#examBg)"/>

  <!-- Office Desk -->
  <rect x="30" y="240" width="340" height="12" rx="6" fill="#1e293b"/>

  <!-- Laptop showing bugs / sprint deploy -->
  <g transform="translate(135, 125)">
    <!-- Screen -->
    <rect x="0" y="0" width="130" height="85" rx="6" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <rect x="6" y="6" width="118" height="73" rx="3" fill="url(#screenGlow)"/>
    <!-- Code / project lines on screen -->
    <line x1="15" y1="20" x2="60" y2="20" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="30" x2="95" y2="30" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="15" y1="40" x2="80" y2="40" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="15" y1="50" x2="105" y2="50" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="15" y1="60" x2="50" y2="60" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Base -->
    <path d="M -15 85 L 145 85 L 135 98 L -5 98 Z" fill="#94a3b8"/>
  </g>

  <!-- Stack of Office Files / Sticky Notes (Left) -->
  <g transform="translate(55, 155)">
    <rect x="0" y="60" width="65" height="18" rx="3" fill="#ef4444"/>
    <rect x="5" y="62" width="55" height="14" fill="#fee2e2"/>
    <rect x="4" y="40" width="60" height="18" rx="3" fill="#3b82f6"/>
    <rect x="8" y="42" width="50" height="14" fill="#dbeafe"/>
    <rect x="2" y="20" width="63" height="18" rx="3" fill="#10b981"/>
    <!-- Sticky notes -->
    <rect x="45" y="14" width="14" height="12" rx="2" fill="#fde047"/>
  </g>

  <!-- Office Coffee Mug (Right) -->
  <g transform="translate(290, 160)">
    <rect x="10" y="15" width="30" height="65" rx="5" fill="#f97316"/>
    <rect x="14" y="25" width="22" height="45" rx="2" fill="#ea580c"/>
    <text x="25" y="52" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">☕</text>
    <ellipse cx="25" cy="15" rx="15" ry="4" fill="#cbd5e1"/>
  </g>

  <!-- Production Deploy texts -->
  <text x="75" y="105" fill="#f43f5e" font-family="sans-serif" font-weight="bold" font-size="18">DEPLOY?!</text>
  <text x="275" y="105" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="18">5:59 PM</text>

  <!-- Badge -->
  <rect x="25" y="25" width="180" height="30" rx="15" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="115" y="45" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12">🚀 DEADLINE SURVIVORS</text>
</svg>