<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="chaiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241430"/>
      <stop offset="100%" stop-color="#0b0614"/>
    </linearGradient>
    <linearGradient id="teaLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#chaiBg)"/>

  <!-- Table -->
  <ellipse cx="200" cy="255" rx="160" ry="35" fill="#180e29"/>
  <rect x="30" y="250" width="340" height="8" rx="4" fill="#3b2554"/>

  <!-- Steam Glass 1 -->
  <path d="M 145 130 Q 130 90 145 60 T 135 25" fill="none" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 165 125 Q 175 85 160 55 T 168 20" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <!-- Steam Glass 2 -->
  <path d="M 235 130 Q 220 90 235 60 T 225 25" fill="none" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 255 125 Q 265 85 250 55 T 258 20" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <!-- GLASS 1 (Left) -->
  <g transform="translate(100, 120)">
    <!-- Liquid -->
    <path d="M 18 45 L 26 120 C 26 125, 64 125, 64 120 L 72 45 Z" fill="url(#teaLiquid)"/>
    <!-- Glass Body Cut Style -->
    <path d="M 10 15 L 24 125 C 25 132, 65 132, 66 125 L 80 15 Z" fill="url(#glassGrad)" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.5"/>
    <!-- Glass Top Rim -->
    <ellipse cx="45" cy="15" rx="35" ry="8" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.7"/>
    <ellipse cx="45" cy="45" rx="27" ry="5" fill="#f59e0b" opacity="0.8"/>
    <!-- Glass vertical ridges -->
    <line x1="30" y1="28" x2="38" y2="120" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.35"/>
    <line x1="45" y1="28" x2="45" y2="122" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.35"/>
    <line x1="60" y1="28" x2="52" y2="120" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.35"/>
  </g>

  <!-- GLASS 2 (Right) -->
  <g transform="translate(210, 120)">
    <!-- Liquid -->
    <path d="M 18 45 L 26 120 C 26 125, 64 125, 64 120 L 72 45 Z" fill="url(#teaLiquid)"/>
    <!-- Glass Body -->
    <path d="M 10 15 L 24 125 C 25 132, 65 132, 66 125 L 80 15 Z" fill="url(#glassGrad)" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.5"/>
    <!-- Glass Top Rim -->
    <ellipse cx="45" cy="15" rx="35" ry="8" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.7"/>
    <ellipse cx="45" cy="45" rx="27" ry="5" fill="#f59e0b" opacity="0.8"/>
    <!-- Ridges -->
    <line x1="30" y1="28" x2="38" y2="120" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.35"/>
    <line x1="45" y1="28" x2="45" y2="122" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.35"/>
    <line x1="60" y1="28" x2="52" y2="120" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.35"/>
  </g>

  <!-- Biscuit plate -->
  <ellipse cx="200" cy="245" rx="42" ry="12" fill="#581c87" opacity="0.5"/>
  <ellipse cx="200" cy="243" rx="38" ry="10" fill="#fef08a" stroke="#d97706" stroke-width="2"/>

  <!-- Badge -->
  <rect x="25" y="25" width="170" height="30" rx="15" fill="#d97706" fill-opacity="0.2" stroke="#d97706" stroke-width="1.5"/>
  <text x="110" y="45" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="12">☕ 4 PM CHAI BREAK</text>
</svg>