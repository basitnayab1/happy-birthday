<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="gameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0845"/>
      <stop offset="100%" stop-color="#0b0217"/>
    </linearGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#gameBg)"/>

  <!-- Neon Grid Floor -->
  <path d="M 0 240 L 400 240 M 50 240 L 0 300 M 150 240 L 100 300 M 250 240 L 300 300 M 350 240 L 400 300" stroke="#a855f7" stroke-width="1.5" opacity="0.3"/>

  <!-- Glowing Game Controller -->
  <g transform="translate(110, 85)">
    <!-- Controller Body -->
    <path d="M 30 75 C 30 140, -10 160, 20 180 C 45 195, 65 170, 75 125 L 105 125 C 115 170, 135 195, 160 180 C 190 160, 150 140, 150 75 C 150 40, 120 30, 90 30 C 60 30, 30 40, 30 75 Z" fill="url(#padGrad)" stroke="#c084fc" stroke-width="3"/>
    
    <!-- Neon Accent Glow Lines -->
    <path d="M 60 65 Q 90 75 120 65" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>

    <!-- D-Pad (Left) -->
    <rect x="45" y="75" width="26" height="8" rx="2" fill="#38bdf8"/>
    <rect x="54" y="66" width="8" height="26" rx="2" fill="#38bdf8"/>

    <!-- Action Buttons (Right) -->
    <circle cx="125" cy="70" r="5" fill="#f43f5e"/>
    <circle cx="137" cy="80" r="5" fill="#22c55e"/>
    <circle cx="113" cy="80" r="5" fill="#eab308"/>
    <circle cx="125" cy="90" r="5" fill="#38bdf8"/>

    <!-- Thumbsticks -->
    <circle cx="68" cy="115" r="14" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <circle cx="68" cy="115" r="7" fill="#38bdf8"/>
    <circle cx="112" cy="115" r="14" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <circle cx="112" cy="115" r="7" fill="#f43f5e"/>

    <!-- Center Logo button -->
    <circle cx="90" cy="90" r="8" fill="#e2e8f0"/>
  </g>

  <!-- Victory text / sparks -->
  <text x="310" y="80" fill="#facc15" font-family="sans-serif" font-weight="900" font-size="20">GG! 🎮</text>
  <text x="75" y="70" fill="#a855f7" font-family="sans-serif" font-weight="900" font-size="16">POST-WORK</text>

  <!-- Badge -->
  <rect x="25" y="25" width="180" height="30" rx="15" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.5"/>
  <text x="115" y="45" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-weight="bold" font-size="12">🎮 AFTER-HOURS SQUAD</text>
</svg>